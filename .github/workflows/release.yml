# Builds the extensions and the userscript on a push to main and publishes them as the release of the package.json
# version. Tests run locally before every commit (pre-commit hook, `bun run check`); no workflow runs them (T-702).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Read version
        run: echo "version=$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          name: ${{ env.version }}
          prerelease: false
          files: |
            LICENSE
            dist/*.zip
            platform/tampermonkey/dist/purpleadblocker.user.js
