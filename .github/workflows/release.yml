# Builds the extensions and the userscript on a push to main and publishes them as the release of the package.json
# version. The first push of a new version also sends it to the stores (T-703): Firefox to addons.mozilla.org (listed,
# reviewed there) and Chrome to the Chrome Web Store (submitted for review), each when its secrets are set.
# Tests run locally before every commit (pre-commit hook, `bun run check`); no workflow runs them (T-702).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Read version
        run: echo "version=$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_ENV"
      - name: Is this version new
        id: version
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Which store secrets are set
        id: stores
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          echo "amo=$([ -n "$AMO_JWT_ISSUER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "cws=$([ -n "$CWS_PUBLISHER_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          name: ${{ env.version }}
          prerelease: false
          files: |
            LICENSE
            dist/*.zip
            platform/tampermonkey/dist/purpleadblocker.user.js
      - name: Firefox, addons.mozilla.org (listed)
        if: steps.version.outputs.new == 'true' && steps.stores.outputs.amo == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bun cli/publish.ts firefox --channel listed
      - name: Chrome Web Store
        if: steps.version.outputs.new == 'true' && steps.stores.outputs.cws == 'true'
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: bun cli/publish.ts chrome
