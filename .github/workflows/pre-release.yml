# Builds the extensions and the userscript when a tag with a hyphen is pushed (2.7.0-beta.1) and publishes them as a
# pre-release of that tag. Tests run locally before every commit; no workflow runs them (T-702).
name: pre-release

on:
  push:
    tags: ["*-*"]

permissions:
  contents: write

jobs:
  pre-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          files: |
            LICENSE
            dist/*.zip
            platform/tampermonkey/dist/purpleadblocker.user.js
